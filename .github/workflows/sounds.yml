# Tür sesleri → R2 (build_sounds.py). YALNIZ elle tetiklenir:
#   Actions → "Species sounds" → Run workflow → limit (tür sayısı; 0 = hepsi).
# Kaldığı yerden devam eder: R2'de olan snd/<id>.m4a yeniden işlenmez. Fotoğraf işinden AYRI eşzamanlılık grubu
# (biri ötekini iptal etmez).
# Çıktı: R2 snd/<sound_id>.m4a + snd-index/sounds.tsv (+ Actions artifact).
name: Species sounds

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Tür sayısı (0 = hepsi)"
        default: "5"
        required: true

permissions:
  contents: read

concurrency:
  group: species-sounds
  cancel-in-progress: false

jobs:
  sounds:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - run: pip install -q boto3==1.40.0
      - name: Sesleri indir, dönüştür, yükle (kaldığı yerden)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python build_sounds.py --species sound_species.tsv --limit ${{ inputs.limit }} --upload --out out
      - uses: actions/upload-artifact@v4
        with:
          name: sound-index
          path: out/sounds.tsv
          retention-days: 90
